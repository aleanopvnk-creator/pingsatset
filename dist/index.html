    <!-- Critical Pre-Paint Theme Styling: 100% Zero-Flicker on Refresh -->
    <style>
      html { background-color: #070d18; color: #f1f5f9; color-scheme: dark; }
      html.light { background-color: #f8fafc; color: #020617; color-scheme: light; }
      body { background-color: inherit; }
    </style>

    <!-- Synchronous Zero-Flicker Script: Executes immediately before DOM paint -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('speedtest_theme') || 'dark';
          var isLight = savedTheme === 'light';
          var root = document.documentElement;
          root.classList.remove(isLight ? 'dark' : 'light');
          root.classList.add(isLight ? 'light' : 'dark');
          root.style.backgroundColor = isLight ? '#f8fafc' : '#070d18';
          root.style.colorScheme = isLight ? 'light' : 'dark';

          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', isLight ? '#f8fafc' : '#070d18');
          }
        } catch (e) {}
      })();
    </script>
